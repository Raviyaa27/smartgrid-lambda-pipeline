# ═══════════════════════════════════════════════════════════════════════
#  smartgrid-lambda-pipeline — infrastructure
#  Section 1 brings up the core: Kafka, PostgreSQL, MinIO (+ Kafka UI).
#  Spark, Airflow, Prometheus and Grafana are added in later sections.
# ═══════════════════════════════════════════════════════════════════════
name: smartgrid

services:

  # ── Ingestion bus ────────────────────────────────────────────────────
  # Single-broker Kafka in KRaft mode (no ZooKeeper). Retention is set to
  # 7 days deliberately: in this Lambda design Kafka is a *transport and
  # short-term recovery* buffer, NOT the system of record. Long-horizon
  # replay is the batch layer's job, served from immutable Parquet in
  # MinIO. That is the cost argument against Kappa, encoded in config.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sg-kafka
    ports:
      - "9092:9092"          # host clients
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by `kafka-init`, never implicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ── One-shot: declare topics ─────────────────────────────────────────
  # 6 partitions on the readings topic: parallelism for the speed layer,
  # while keying by meter_id preserves per-meter ordering. The DLQ gets a
  # longer retention than the source topic so poison messages survive
  # long enough to be investigated.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sg-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    # NOTE: `command` must be a LIST whose single element is the whole script.
    # A plain string here gets shell-split by Compose, and `sh -c` would then
    # treat only the first word as the script and the rest as $0, $1, ...
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic ${KAFKA_TOPIC_READINGS} --partitions 6 --replication-factor 1 \
          --config retention.ms=604800000
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic ${KAFKA_TOPIC_DLQ} --partitions 3 --replication-factor 1 \
          --config retention.ms=1209600000
        echo "[kafka-init] topics now present:"
        kafka-topics --bootstrap-server kafka:29092 --list

  # ── Kafka UI (developer observability) ───────────────────────────────
  # Port 8085 to leave 8080 free for Airflow in Section 6.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: sg-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smartgrid-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

  # ── Serving store ────────────────────────────────────────────────────
  # One instance, two databases: `smartgrid` (serving) and `airflow`
  # (orchestrator metadata). Inside `smartgrid`, three schemas separate
  # the Lambda layers — see infra/postgres/init/01_init.sql.
  postgres:
    image: postgres:16-alpine
    container_name: sg-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_SERVING_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_SERVING_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Object store: the immutable master dataset ───────────────────────
  # S3-compatible, so every path and client call is identical to what a
  # real deployment would use against S3.
  #   raw/  = landing zone for daily batch drops (tariff, weather)
  #   lake/ = Parquet master dataset appended by the speed layer and
  #           read by the batch layer. This is the system of record.
  #
  # Image provenance. MinIO first withdrew its images from docker.io, then
  # (late September 2026) from quay.io as well -- the previously pinned
  # quay.io RELEASE tags now return "no such manifest". This uses Bitnami's
  # build instead. Note that the `bitnamilegacy` namespace is Bitnami's
  # FROZEN archive: pinned and reproducible, but it receives no security
  # updates. Acceptable for a local, single-user demo; a real deployment
  # would use a managed S3 service rather than self-hosting MinIO.
  #
  # Buckets are created by the image itself (MINIO_DEFAULT_BUCKETS), so
  # there is no separate init container. Bitnami creates them a few seconds
  # AFTER the server first answers health probes, so the healthcheck below
  # asserts the buckets exist rather than only that the server is up --
  # "healthy" means provisioned, not merely running.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: sg-minio
    ports:
      - "9000:9000"          # S3 API
      - "9001:9001"          # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET_RAW},${MINIO_BUCKET_LAKE}
    volumes:
      # Bitnami runs as uid 1001 and keeps data under /bitnami/minio/data.
      # A volume written by the old root-run image is not writable by it,
      # hence a new volume name rather than reusing `minio-data`.
      - minio-bitnami-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "mc ls local/${MINIO_BUCKET_RAW} >/dev/null && mc ls local/${MINIO_BUCKET_LAKE} >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── Speed layer: Spark Structured Streaming (ADR-0002) ───────────────
  # Our own image (docker/spark.Dockerfile): Python 3.11 + PySpark 3.5 with
  # the Kafka and S3A connectors baked in at build time. The repository is
  # mounted read-only at /app, so a code change needs a restart, not a
  # rebuild. Checkpoints live on a named volume, one directory per
  # simulation, so the stream resumes exactly where it stopped.
  speed-layer:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    image: smartgrid-spark:3.5.9
    container_name: sg-speed-layer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["python", "-m", "smartgrid.streaming.speed_layer"]
    volumes:
      - ./:/app:ro
      - spark-checkpoints:/checkpoints
    ports:
      - "9103:9103"          # Prometheus metrics
      - "4040:4040"          # Spark UI
    # A streaming job is meant to run forever: if it dies, bring it back.
    restart: unless-stopped

volumes:
  kafka-data:
  pg-data:
  minio-bitnami-data:
  spark-checkpoints:
