# ═══════════════════════════════════════════════════════════════════════
#  smartgrid-lambda-pipeline — infrastructure
#  Kafka, PostgreSQL and MinIO (+ Kafka UI); the Spark speed layer;
#  Airflow running the Spark batch layer; the serving API; the business
#  dashboard; and Prometheus with Grafana for observability.
# ═══════════════════════════════════════════════════════════════════════
name: smartgrid

services:

  # ── Ingestion bus ────────────────────────────────────────────────────
  # Single-broker Kafka in KRaft mode (no ZooKeeper). Retention is set to
  # 7 days deliberately: in this Lambda design Kafka is a *transport and
  # short-term recovery* buffer, NOT the system of record. Long-horizon
  # replay is the batch layer's job, served from immutable Parquet in
  # MinIO. That is the cost argument against Kappa, encoded in config.
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sg-kafka
    ports:
      - "9092:9092"          # host clients
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by `kafka-init`, never implicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 168
      # Default heap is 1 GB; this workload needs far less, and memory is the
      # constraint on a laptop running Kafka, Spark and Airflow together.
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:29092"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ── One-shot: declare topics ─────────────────────────────────────────
  # 6 partitions on the readings topic: parallelism for the speed layer,
  # while keying by meter_id preserves per-meter ordering. The DLQ gets a
  # longer retention than the source topic so poison messages survive
  # long enough to be investigated.
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sg-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    # NOTE: `command` must be a LIST whose single element is the whole script.
    # A plain string here gets shell-split by Compose, and `sh -c` would then
    # treat only the first word as the script and the rest as $0, $1, ...
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic ${KAFKA_TOPIC_READINGS} --partitions 6 --replication-factor 1 \
          --config retention.ms=604800000
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
          --topic ${KAFKA_TOPIC_DLQ} --partitions 3 --replication-factor 1 \
          --config retention.ms=1209600000
        echo "[kafka-init] topics now present:"
        kafka-topics --bootstrap-server kafka:29092 --list

  # ── Kafka UI (developer observability) ───────────────────────────────
  # Port 8085 to leave 8080 free for Airflow.
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: sg-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smartgrid-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_OPTS: "-Xms64m -Xmx256m"

  # ── Serving store ────────────────────────────────────────────────────
  # One instance, two databases: `smartgrid` (serving) and `airflow`
  # (orchestrator metadata). Inside `smartgrid`, three schemas separate
  # the Lambda layers — see infra/postgres/init/01_init.sql.
  postgres:
    image: postgres:16-alpine
    container_name: sg-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_SERVING_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_SERVING_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Object store: the immutable master dataset ───────────────────────
  # S3-compatible, so every path and client call is identical to what a
  # real deployment would use against S3.
  #   raw/  = landing zone for daily batch drops (tariff, weather)
  #   lake/ = Parquet master dataset appended by the speed layer and
  #           read by the batch layer. This is the system of record.
  #
  # Image provenance. MinIO first withdrew its images from docker.io, then
  # (late September 2026) from quay.io as well -- the previously pinned
  # quay.io RELEASE tags now return "no such manifest". This uses Bitnami's
  # build instead. Note that the `bitnamilegacy` namespace is Bitnami's
  # FROZEN archive: pinned and reproducible, but it receives no security
  # updates. Acceptable for a local, single-user demo; a real deployment
  # would use a managed S3 service rather than self-hosting MinIO.
  #
  # Buckets are created by the image itself (MINIO_DEFAULT_BUCKETS), so
  # there is no separate init container. Bitnami creates them a few seconds
  # AFTER the server first answers health probes, so the healthcheck below
  # asserts the buckets exist rather than only that the server is up --
  # "healthy" means provisioned, not merely running.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: sg-minio
    ports:
      - "9000:9000"          # S3 API
      - "9001:9001"          # web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_BUCKET_RAW},${MINIO_BUCKET_LAKE}
    volumes:
      # Bitnami runs as uid 1001 and keeps data under /bitnami/minio/data.
      # A volume written by the old root-run image is not writable by it,
      # hence a new volume name rather than reusing `minio-data`.
      - minio-bitnami-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "mc ls local/${MINIO_BUCKET_RAW} >/dev/null && mc ls local/${MINIO_BUCKET_LAKE} >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── Speed layer: Spark Structured Streaming (ADR-0002) ───────────────
  # Our own image (docker/spark.Dockerfile): Python 3.11 + PySpark 3.5 with
  # the Kafka and S3A connectors baked in at build time. The repository is
  # mounted read-only at /app, so a code change needs a restart, not a
  # rebuild. Checkpoints live on a named volume, one directory per
  # simulation, so the stream resumes exactly where it stopped.
  speed-layer:
    build:
      context: .
      dockerfile: docker/spark.Dockerfile
    image: smartgrid-spark:3.5.9
    container_name: sg-speed-layer
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: ["python", "-m", "smartgrid.streaming.speed_layer"]
    volumes:
      - ./:/app:ro
      - spark-checkpoints:/checkpoints
    ports:
      - "9103:9103"          # Prometheus metrics
      - "4040:4040"          # Spark UI
    # A streaming job is meant to run forever: if it dies, bring it back.
    restart: unless-stopped

  # ── Batch layer orchestration: Airflow 3.1 (ADR-0006) ───────────────
  # The official image plus the same Spark runtime as the speed layer
  # (docker/airflow.Dockerfile), so settlement runs the same engine. One
  # container, `airflow standalone`: API server, scheduler, DAG processor
  # and triggerer, with LocalExecutor on the shared PostgreSQL. The UI needs
  # no login -- acceptable for a local demo, never for anything shared.
  airflow:
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    image: smartgrid-airflow:3.1.0
    container_name: sg-airflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
    command: ["standalone"]
    environment:
      _AIRFLOW_DB_MIGRATE: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_AIRFLOW_DB}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "8"
      AIRFLOW__CORE__DAGS_FOLDER: /app/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "20"
      AIRFLOW__API__WORKERS: "1"
      # Fixed secrets so every Airflow component signs and verifies with the
      # same keys. Development values: override them in .env.
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-smartgrid-dev-jwt-secret-change-me}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-smartgrid-dev-secret-key-change-me}
    volumes:
      - ./:/app:ro
      - airflow-logs:/opt/airflow/logs
    ports:
      - "8080:8080"          # Airflow UI and REST API
    restart: unless-stopped

  # ── Serving layer: the merge rule behind one API (ADR-0001) ─────────
  # Reads speed.*, batch.* and ops.* and the published reports; writes
  # nothing. Healthy while it can reach PostgreSQL: a stale speed layer
  # makes /health report "degraded", not the API unhealthy.
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: smartgrid-api:1.0
    container_name: sg-api
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./:/app:ro
    ports:
      - "8000:8000"          # API; interactive docs at /docs, Prometheus at /metrics
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Business dashboard: Streamlit, reading only the serving API ─────
  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
    image: smartgrid-dashboard:1.0
    container_name: sg-dashboard
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./:/app:ro
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Observability: Prometheus scrapes, evaluates the alert rules ────
  # (ADR-0009). Rules and their promtool tests live in infra/prometheus.
  prometheus:
    image: prom/prometheus:v3.5.1
    container_name: sg-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    # The two sources run on the host; this makes host.docker.internal
    # resolve on Linux too (Docker Desktop provides it already).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Observability: Grafana, the operations dashboard ────────────────
  # Provisioned data source and dashboard; anonymous read-only viewing.
  grafana:
    image: grafana/grafana:12.2.0
    container_name: sg-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-smartgrid-dev-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/smartgrid-operations.json
      # No phoning home, no plugin downloads at startup.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  kafka-data:
  pg-data:
  minio-bitnami-data:
  spark-checkpoints:
  airflow-logs:
  prometheus-data:
  grafana-data:
