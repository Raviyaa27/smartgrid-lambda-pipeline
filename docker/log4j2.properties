# Spark's own (JVM) logging. Kept at WARN so the job's structured JSON logs
# from Python are the signal, not Spark's start-up chatter.
rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd'T'HH:mm:ss.SSS}Z %p [spark] %c{1}: %m%n

# Known-harmless warnings on every start in a container.
logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = error
logger.metrics2.name = org.apache.hadoop.metrics2.impl.MetricsConfig
logger.metrics2.level = error
logger.s3aconf.name = org.apache.hadoop.fs.s3a.impl.ConfigurationHelper
logger.s3aconf.level = error
logger.kafkaconfig.name = org.apache.kafka.clients.admin.AdminClientConfig
logger.kafkaconfig.level = error
logger.kafkaconsumerconfig.name = org.apache.kafka.clients.consumer.ConsumerConfig
logger.kafkaconsumerconfig.level = error
logger.kafkaproducerconfig.name = org.apache.kafka.clients.producer.ProducerConfig
logger.kafkaproducerconfig.level = error
