# Prometheus for smartgrid-lambda-pipeline (ADR-0009).
#
# Pull model: every component serves /metrics and Prometheus scrapes it, so a
# component that dies shows up as `up == 0` instead of silently going quiet.
# Intervals are REAL seconds: 10 s is 48 simulated minutes at 288x.

global:
  scrape_interval: 10s
  evaluation_interval: 10s
  external_labels:
    project: smartgrid

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Request metrics, plus the business and pipeline state only the serving
  # store knows: zone freshness and solar share, settlement backlog.
  - job_name: serving-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: speed-layer
    static_configs:
      - targets: ["speed-layer:9103"]

  # The two simulated sources run on the host (python -m ...); from inside
  # Docker the host is host.docker.internal.
  - job_name: meter-simulator
    static_configs:
      - targets: ["host.docker.internal:9101"]

  - job_name: daily-batch-source
    static_configs:
      - targets: ["host.docker.internal:9102"]
