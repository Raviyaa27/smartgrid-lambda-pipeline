# Dashboards provisioned from files. They are generated by
# scripts/build_grafana_dashboard.py and read-only in the UI: a change is made
# in the generator and reviewed as code.
apiVersion: 1
providers:
  - name: smartgrid
    folder: Smart grid
    type: file
    disableDeletion: true
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
