# Grafana data source, provisioned at startup: nothing to click through.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 10s   # the scrape interval, so $__rate_interval is right
